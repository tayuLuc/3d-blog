<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blackbox — Agent Viz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;700;900&family=Golos+Text:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/layout.css">
</head>
<body data-mode="blog">
  <header class="topbar">
    <div class="logo">
      <span class="logo-mark">◈</span>
      <span class="logo-text">blackbox</span>
      <span class="logo-divider">/</span>
      <span class="logo-tag">agent viz</span>
    </div>
    <nav class="modes">
      <button data-mode="blog" class="active">Блог</button>
      <button data-mode="together">Вместе</button>
      <button data-mode="3d">3D</button>
    </nav>
  </header>
  <main class="workspace">
    <aside class="panel blog-panel" id="blog-panel">
      <div id="blog-content"></div>
    </aside>
    <section class="panel scene-panel" id="scene-panel">
      <canvas id="scene-canvas"></canvas>
      <div class="hud" id="hud">
        <span class="hud-item" id="hud-tokens">tokens ∞</span>
        <span class="hud-item" id="hud-tasks">tasks 0</span>
        <span class="hud-item" id="hud-aim" style="display:none">● targeting</span>
      </div>
      <div class="hint" id="hint">1–3 — режимы · Esc — выход · Click — стрельба</div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
